[project]
name = "swarmui-worker"
version = "1.0.0"
description = "Provider-neutral supervisor for SwarmUI cloud workers, by Hartsy."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "yarl>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
