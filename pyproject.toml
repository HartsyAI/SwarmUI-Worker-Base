[project]
name = "swarmui-worker"
version = "0.1.0"
description = "Provider-neutral supervisor for SwarmUI cloud workers, by Hartsy."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
